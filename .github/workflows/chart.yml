name: chart
on: { push: { branches: [main], tags: ["v*"] }, pull_request: {} }
permissions: { contents: read }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - name: Lint and render every profile
        run: |
          helm lint charts/gjallar
          helm template t charts/gjallar > /dev/null
          helm template t charts/gjallar -f charts/gjallar/values-kind.yaml > /dev/null
          helm template t charts/gjallar --set keda.enabled=true --set workers.patch.enabled=true \
            --set agent.runtime.enabled=true --set agent.regolibrary.enabled=true --set networkPolicy.enabled=true \
            --set analytics.mode=ducklake --set analytics.s3.dataPath=s3://x/ --set analytics.s3.existingSecret=s > /dev/null
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Package, push to GHCR (OCI) and sign
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/gjallar --version "${GITHUB_REF_NAME#v}"
          out=$(helm push gjallar-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1); echo "$out"
          digest=$(echo "$out" | sed -n 's/^Digest: //p')
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/gjallar@${digest}"
