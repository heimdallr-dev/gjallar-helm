{{- if .Values.nats.enabled }}
{{- $c := dict "root" . "component" "nats" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gj.fullname" . }}-nats
  labels: {{- include "gj.labels" . | nindent 4 }}
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    server_name: gjallar-nats
    max_payload: 8MB
    jetstream {
      store_dir: /data
      max_file_store: {{ .Values.nats.storage | replace "Gi" "G" }}
    }
    {{- if eq .Values.nats.auth "users" }}
    # Services share user "gjallar". Agents (also from other clusters) get user
    # "agent": they can report inventory and runtime data and read SBOMs, but
    # cannot queue jobs, forge results or change streams. A leaked agent
    # password therefore cannot steer the hub. Same list as core's
    # internal/adapters/natsbus/testdata/users.conf (tested there).
    authorization {
      users: [
        { user: gjallar, password: $GJALLAR_NATS_TOKEN }
        { user: agent, password: $GJALLAR_NATS_AGENT_PASSWORD, permissions: {
            publish: { allow: [
              "gjallar.inventory.>", "gjallar.events.runtime", "$KV.gjallar-runtime.>",
              "$JS.API.STREAM.INFO.KV_gjallar-runtime", "$JS.API.STREAM.INFO.OBJ_gjallar-sboms",
              "$JS.API.DIRECT.GET.KV_gjallar-runtime.>", "$JS.API.STREAM.MSG.GET.KV_gjallar-runtime",
              "$JS.API.DIRECT.GET.OBJ_gjallar-sboms.>", "$JS.API.STREAM.MSG.GET.OBJ_gjallar-sboms",
              "$JS.API.CONSUMER.CREATE.OBJ_gjallar-sboms", "$JS.API.CONSUMER.CREATE.OBJ_gjallar-sboms.>",
              "$JS.API.CONSUMER.DELETE.OBJ_gjallar-sboms.>", "$JS.FC.OBJ_gjallar-sboms.>"
            ] }
            subscribe: { allow: ["_INBOX_agent.>"] }
        } }
      ]
    }
    {{- else }}
    # Every client must present the token (Secret {{ include "gj.natsSecret" . }}).
    authorization { token: $GJALLAR_NATS_TOKEN }
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gj.fullname" . }}-nats
  labels: {{- include "gj.labels" . | nindent 4 }}
spec:
  selector: {{- include "gj.selector" $c | nindent 4 }}
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gj.fullname" . }}-nats
  labels: {{- include "gj.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gj.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels: {{- include "gj.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "gj.selector" $c | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.nats | toJson | sha256sum }}
    spec:
      securityContext: {{- include "gj.podSecurity" . | nindent 8 }}
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: GJALLAR_NATS_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "gj.natsSecret" . }}, key: token } }
            - name: GJALLAR_NATS_AGENT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "gj.natsSecret" . }}, key: agent-password, optional: true } }
          ports:
            - { containerPort: 4222, name: client }
            - { containerPort: 8222, name: monitor }
          readinessProbe: { httpGet: { path: /healthz, port: 8222 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: "/healthz?js-enabled-only=true", port: 8222 }, periodSeconds: 30 }
          securityContext: {{- include "gj.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: {{ include "gj.fullname" . }}-nats }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.nats.storageClass | default .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.nats.storage }} } }
{{- end }}
