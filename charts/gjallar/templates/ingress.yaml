{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gj.fullname" . }}
  labels: {{- include "gj.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.web.host | quote }}
      http:
        paths:
          {{- if and .Values.mcp.enabled (not .Values.ingress.mcp.host) }}
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: {{ include "gj.fullname" . }}-mcp, port: { number: 8082 } } }
          - path: /.well-known/oauth-protected-resource
            pathType: Exact
            backend: { service: { name: {{ include "gj.fullname" . }}-mcp, port: { number: 8082 } } }
          {{- end }}
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "gj.fullname" . }}-web, port: { number: 8083 } } }
    {{- if and .Values.mcp.enabled .Values.ingress.mcp.host }}
    - host: {{ .Values.ingress.mcp.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "gj.fullname" . }}-mcp, port: { number: 8082 } } }
    {{- end }}
{{- end }}
