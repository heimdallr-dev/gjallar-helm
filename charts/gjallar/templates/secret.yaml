{{- if and .Values.nats.enabled (not .Values.nats.tokenSecret) }}
{{- $name := printf "%s-nats" (include "gj.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $tok := randAlphaNum 32 }}
{{- $agent := randAlphaNum 32 }}
{{- if $existing }}{{- $tok = index $existing.data "token" | b64dec }}{{- with index $existing.data "agent-password" }}{{- $agent = . | b64dec }}{{- end }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gj.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $tok | quote }}              # services (user "gjallar")
  agent-password: {{ $agent | quote }}  # agents, also in other clusters (user "agent")
---
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
{{- $name := printf "%s-db" (include "gj.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := .Values.postgresql.password }}
{{- if not $pw }}{{- if $existing }}{{- $pw = index $existing.data "password" | b64dec }}{{- else }}{{- $pw = randAlphaNum 24 }}{{- end }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gj.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $pw | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgresql.username $pw (include "gj.fullname" .) .Values.postgresql.database | quote }}
  LAKE_CATALOG: {{ printf "postgres:dbname=%s host=%s-postgres user=%s password=%s" .Values.postgresql.database (include "gj.fullname" .) .Values.postgresql.username $pw | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gj.fullname" . }}-policy
  labels: {{- include "gj.labels" . | nindent 4 }}
data:
  license-policy.json: {{ toJson .Values.workers.license.policy | quote }}
  {{- with .Values.workers.license.grantConfig }}
  grant.yaml: {{ . | quote }}
  {{- end }}
